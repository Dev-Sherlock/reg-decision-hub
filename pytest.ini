[pytest]
asyncio_mode = auto
# The session-scoped `stack` fixture opts into the session event loop with an
# explicit loop_scope="session" marker, which is how pytest-asyncio lets a
# session fixture coexist with function-scoped tests.
asyncio_default_fixture_loop_scope = function
testpaths = src/api/tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
